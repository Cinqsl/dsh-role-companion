name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check generated files are committed
        run: test -z "$(git status --porcelain)"
      - run: npm run typecheck
      - run: npm run pack:plugin
      - name: Check packaging leaves no source changes
        run: test -z "$(git status --porcelain)"

  test:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run test shard ${{ matrix.shard }}/6
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/6 test/*.test.mjs
